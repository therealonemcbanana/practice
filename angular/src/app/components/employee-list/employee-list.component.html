<h2>Employee List</h2>
<table class="employee-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Salary</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let employee of employees">
      <td>{{ employee.id }}</td>
      <td>{{ employee.name }}</td>
      <td>{{ employee.salary | currency }}</td>
      <td class="actions">
        <div class="action-buttons">
          <button (click)="editEmployee(employee.id)" class="edit-btn">Edit</button>
          <button (click)="deleteEmployee(employee.id)" class="delete-btn">Delete</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>

<div class="actions-container">
  <button (click)="addEmployee()" class="add-btn">Add Employee</button>
  <button type="button" (click)="goBack()" class="back-btn">Back</button>
</div>
