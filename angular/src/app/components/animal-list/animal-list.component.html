<div class="animal-list-container">
    <h2>Animals</h2>
  
    <table class="animal-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Gender</th>
          <th>Age</th>
          <th>Aviary</th>
          <th>Species</th>
          <th>Food</th>
          <th>Employees</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let animal of animals">
          <td>{{ animal.name }}</td>
          <td>{{ animal.gender }}</td>
          <td>{{ animal.age }}</td>
          <td>{{ animal.aviary.id }}</td>
          <td>{{ animal.species.title }}</td>
          <td>
            <div *ngFor="let food of animal.foodSet">{{ food.name }}</div>
          </td>
          <td>
            <div *ngFor="let employee of animal.employees">{{ employee.name }}</div>
          </td>
          <td>
            <button (click)="editAnimal(animal.id)" class="edit-btn">Edit</button>
            <button (click)="deleteAnimal(animal.id)" class="delete-btn">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <div class="actions-container">
      <button (click)="addAnimal()" class="add-btn">Add Animal</button>
      <button (click)="goBack()" class="back-btn">Back</button>
    </div>
  </div>
